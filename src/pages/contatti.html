<section class="hero small"><div class="wrap"><h1>{{contatti.title}}</h1></div></section>

<section><div class="wrap">
  <h2>{{contatti.heading}}</h2>
  <p class="lead">{{contatti.text}}</p>
  <div class="contact">
    <div class="tile">
      <p class="eyebrow">{{contatti.emailLabel}}</p>
      <p class="mail"><a id="email" href="mailto:{{contatti.email}}">{{contatti.email}}</a>
        <button class="copy" type="button" data-copy="{{contatti.email}}" data-done="{{contatti.copied}}">{{contatti.copy}}</button></p>
    </div>
    <div class="tile">
      <p class="eyebrow">{{contatti.placeLabel}}</p>
      <p class="mail">{{contatti.place}}</p>
    </div>
  </div>
</div></section>
