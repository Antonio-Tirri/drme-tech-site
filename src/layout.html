<!doctype html>
<html lang="{{meta.lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{{page.fullTitle}}}</title>
<meta name="description" content="{{page.description}}">
<link rel="canonical" href="{{{page.canonical}}}">
<link rel="alternate" hreflang="it" href="{{{page.hrefIt}}}">
<link rel="alternate" hreflang="en" href="{{{page.hrefEn}}}">
<link rel="alternate" hreflang="x-default" href="{{{page.hrefIt}}}">
<meta property="og:type" content="website">
<meta property="og:site_name" content="{{meta.siteName}}">
<meta property="og:locale" content="{{meta.locale}}">
<meta property="og:title" content="{{{page.fullTitle}}}">
<meta property="og:description" content="{{page.description}}">
<meta property="og:url" content="{{{page.canonical}}}">
<meta property="og:image" content="{{{site.url}}}/assets/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="keywords" content="{{meta.keywords}}">
<script type="application/ld+json">{{{page.jsonld}}}</script>
<meta name="theme-color" content="#0a0e18">
<link rel="icon" type="image/png" sizes="512x512" href="/assets/favicon.png">
<link rel="apple-touch-icon" href="/assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/assets/styles.css">
</head>
<body>
<a class="skip" href="#main">{{meta.skip}}</a>
<header class="top"><div class="wrap">
  <a href="{{{page.homeHref}}}" class="brand"><img src="/assets/logo.png" alt="drme.tech" width="959" height="236"></a>
  <nav aria-label="Menu">{{{page.nav}}}</nav>
  <a class="lang" href="{{{page.altHref}}}" hreflang="{{{page.altLang}}}" aria-label="{{meta.langSwitchLabel}}">{{meta.langSwitch}}</a>
</div></header>
<main id="main">
{{{page.body}}}
</main>
<footer><div class="wrap"><span>{{footer.copy}}</span><img src="/assets/favicon.png" alt="" width="28" height="28"></div></footer>
<script src="/assets/site.js" defer></script>
<script src="/assets/hero-fx.js" defer></script>
</body>
</html>
